<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INV-8915412 · Jack Archer Audit</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');
:root {
  --bg:#0D0F0E; --s1:#151918; --s2:#1C2220; --br:#2A3330;
  --tx:#E8EDE8; --mu:#6B7D74; --gr:#4ADE80; --am:#F59E0B;
  --rd:#F87171; --bl:#60A5FA; --pu:#A78BFA;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;font-size:13px;}
#app{display:flex;flex-direction:column;height:100vh;}
#hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 28px;border-bottom:1px solid var(--br);flex-shrink:0;}
.dot{width:26px;height:26px;background:var(--gr);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:10px;color:#000;font-weight:500;}
.hdr-l{display:flex;align-items:center;gap:10px;}
.ht{font-size:14px;font-weight:600;}
.hs{font-family:'DM Mono',monospace;font-size:10px;color:var(--mu);margin-top:1px;}
.bdg{background:var(--s2);border:1px solid var(--br);border-radius:4px;padding:3px 9px;font-family:'DM Mono',monospace;font-size:10px;}
.bdg.rd{color:var(--rd);border-color:rgba(248,113,113,.3);}
#nav{display:flex;border-bottom:1px solid var(--br);padding:0 28px;flex-shrink:0;}
.tab{padding:8px 13px;font-size:12px;font-weight:500;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;}
.tab:hover{color:var(--tx);}
.tab.on{color:var(--gr);border-bottom-color:var(--gr);}
#content{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 28px 20px;}
#content::-webkit-scrollbar{width:4px;}
#content::-webkit-scrollbar-thumb{background:var(--br);border-radius:2px;}
.kpis{display:grid;gap:10px;margin-bottom:12px;}
.c4{grid-template-columns:repeat(4,1fr);}
.c3{grid-template-columns:repeat(3,1fr);}
.kpi{background:var(--s1);border:1px solid var(--br);border-radius:7px;padding:11px 13px;position:relative;overflow:hidden;}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--gr);opacity:.4;}
.kpi.rd::after{background:var(--rd);}
.kpi.am::after{background:var(--am);}
.kl{font-size:9px;font-weight:500;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;}
.kv{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;line-height:1;margin-bottom:3px;}
.ks{font-size:10px;color:var(--mu);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;}
.card{background:var(--s1);border:1px solid var(--br);border-radius:7px;padding:13px;}
.ct{font-size:9px;font-weight:500;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;}
.ri{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--br);}
.ri:last-child{border-bottom:none;}
.mono{font-family:'DM Mono',monospace;font-size:11px;}
.flags{display:flex;flex-direction:column;gap:8px;}
.flag{background:var(--s1);border:1px solid var(--br);border-radius:7px;padding:12px 14px;display:flex;gap:10px;}
.flag.cr{border-left:3px solid var(--rd);}
.flag.wa{border-left:3px solid var(--am);}
.fi{font-size:16px;flex-shrink:0;margin-top:1px;}
.fc{flex:1;}
.ft{font-weight:600;font-size:12px;margin-bottom:2px;}
.fd{font-size:11px;color:var(--mu);line-height:1.5;margin-bottom:5px;}
.fa{font-family:'DM Mono',monospace;font-size:10px;color:var(--gr);}
.famt{font-family:'DM Mono',monospace;font-size:16px;font-weight:500;white-space:nowrap;text-align:right;}
.flag.cr .famt{color:var(--rd);}
.flag.wa .famt{color:var(--am);}
.faml{font-family:'DM Mono',monospace;font-size:9px;color:var(--mu);text-align:right;margin-top:1px;}
.tbl-wrap{background:var(--s1);border:1px solid var(--br);border-radius:7px;overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{padding:8px 11px;text-align:left;font-family:'DM Mono',monospace;font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);border-bottom:1px solid var(--br);background:var(--s2);}
tbody tr{border-bottom:1px solid var(--br);}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--s2);}
tbody td{padding:8px 11px;}
.b{display:inline-block;padding:1px 5px;border-radius:3px;font-family:'DM Mono',monospace;font-size:9px;font-weight:500;}
.brd{background:rgba(248,113,113,.12);color:var(--rd);}
.bam{background:rgba(245,158,11,.12);color:var(--am);}
.bgr{background:rgba(74,222,128,.12);color:var(--gr);}
.bbl{background:rgba(96,165,250,.12);color:var(--bl);}
.bpu{background:rgba(167,139,250,.12);color:var(--pu);}
.cbr{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.cbn{width:130px;font-size:12px;flex-shrink:0;}
.cbt{flex:1;height:5px;background:var(--s2);border-radius:3px;overflow:hidden;}
.cbf{height:100%;border-radius:3px;}
.cbs{width:160px;display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:10px;color:var(--mu);flex-shrink:0;}
.cbs b{color:var(--tx);}
.opp{background:linear-gradient(135deg,rgba(74,222,128,.07),rgba(74,222,128,.02));border:1px solid rgba(74,222,128,.2);border-radius:7px;padding:14px 16px;margin-bottom:10px;}
.opp-t{font-size:12px;font-weight:600;color:var(--gr);margin-bottom:5px;}
.opp-b{font-size:11px;color:var(--mu);line-height:1.6;}
.opp-b strong{color:var(--tx);}
.act{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--br);font-size:11px;line-height:1.5;}
.act:last-child{border-bottom:none;}
.ai{width:18px;height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;font-size:10px;}
.ard{background:rgba(248,113,113,.1);}
.aam{background:rgba(245,158,11,.1);}
.agr{background:rgba(74,222,128,.1);}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div class="hdr-l">
      <div class="dot">JA</div>
      <div>
        <div class="ht">ShipBob Audit · INV-8915412</div>
        <div class="hs">Jack Archer · Jan 26–30, 2026 · 49 pages</div>
      </div>
    </div>
    <div style="display:flex;gap:7px">
      <div class="bdg">Feb 2, 2026</div>
      <div class="bdg rd">4 Flags · ~$330 at risk</div>
    </div>
  </div>
  <div id="nav">
    <div class="tab on" onclick="go(0,this)">Overview</div>
    <div class="tab" onclick="go(1,this)">Carriers</div>
    <div class="tab" onclick="go(2,this)">Audit Flags</div>
    <div class="tab" onclick="go(3,this)">High-Value</div>
    <div class="tab" onclick="go(4,this)">Opportunity</div>
  </div>
  <div id="content"></div>
</div>
<script>
const PAGES=[p0,p1,p2,p3,p4];
let chart=null;
const G={grid:{color:'#2A3330'},ticks:{color:'#6B7D74',font:{size:10,family:'DM Mono'}}};

function go(i,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  if(chart){chart.destroy();chart=null;}
  document.getElementById('content').innerHTML='';
  PAGES[i]();
}
go(0,document.querySelector('.tab'));

function p0(){
  document.getElementById('content').innerHTML=`
  <div class="kpis c4">
    <div class="kpi"><div class="kl">Invoice Total</div><div class="kv">$15,136</div><div class="ks">Feb 2 · 5-day period</div></div>
    <div class="kpi am"><div class="kl">Avg / Shipment</div><div class="kv">$7.66</div><div class="ks">~1,975 total shipments</div></div>
    <div class="kpi"><div class="kl">Best Carrier Avg</div><div class="kv" style="color:var(--gr)">$5.74</div><div class="ks">Amazon Logistics · 59.7% vol</div></div>
    <div class="kpi rd"><div class="kl">Dispute Candidates</div><div class="kv">$330</div><div class="ks">4 confirmed anomalies</div></div>
  </div>
  <div class="g2">
    <div class="card"><div class="ct">Daily Volume &amp; Spend</div><div style="height:120px"><canvas id="c1"></canvas></div></div>
    <div class="card"><div class="ct">Spend by Carrier</div><div style="height:120px"><canvas id="c2"></canvas></div></div>
  </div>
  <div class="g2">
    <div class="card"><div class="ct">Charge Distribution</div><div style="height:100px"><canvas id="c3"></canvas></div></div>
    <div class="card"><div class="ct">Invoice Summary</div>
      <div class="ri"><span style="flex:1;color:var(--mu)">Invoice #</span><span class="mono" style="color:var(--gr)">8915412</span></div>
      <div class="ri"><span style="flex:1;color:var(--mu)">Period</span><span class="mono">Jan 26–30, 2026</span></div>
      <div class="ri"><span style="flex:1;color:var(--mu)">Carrier mix</span><span class="mono">6 carriers</span></div>
      <div class="ri"><span style="flex:1;color:var(--mu)">Max charge</span><span class="mono" style="color:var(--rd)">$65.43 ×2</span></div>
      <div class="ri"><span style="flex:1;color:var(--mu)">Min charge</span><span class="mono" style="color:var(--gr)">$4.68</span></div>
      <div class="ri"><span style="flex:1;font-weight:600">Total</span><span class="mono" style="font-size:13px;font-weight:600">$15,136.10</span></div>
    </div>
  </div>`;

  new Chart(document.getElementById('c1'),{
    data:{labels:['Jan 26','Jan 27','Jan 28','Jan 29','Jan 30'],
      datasets:[
        {type:'bar',data:[720,310,420,340,185],backgroundColor:'rgba(74,222,128,.2)',borderColor:'#4ADE80',borderWidth:1.5,borderRadius:3,yAxisID:'y'},
        {type:'line',data:[5890,2420,3180,2460,1186],borderColor:'#F59E0B',backgroundColor:'transparent',borderWidth:2,pointRadius:3,pointBackgroundColor:'#F59E0B',tension:.3,yAxisID:'y1'}
      ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{grid:G.grid,ticks:G.ticks},y:{grid:G.grid,ticks:G.ticks},
        y1:{position:'right',grid:{display:false},ticks:{...G.ticks,color:'#F59E0B',callback:v=>'$'+(v/1000).toFixed(1)+'k'}}}}
  });

  chart=new Chart(document.getElementById('c2'),{
    type:'doughnut',
    data:{labels:['Amazon','FedEx','SB Ground','UPS','Other'],
      datasets:[{data:[6773,3474,2917,1208,764],backgroundColor:['#4ADE80','#60A5FA','#F59E0B','#F87171','#A78BFA'],borderColor:'#151918',borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'68%',
      plugins:{legend:{display:true,position:'right',labels:{color:'#6B7D74',font:{size:10,family:'DM Mono'},boxWidth:8,padding:7}}}}
  });

  new Chart(document.getElementById('c3'),{
    type:'bar',
    data:{labels:['<$6','$6-7','$7-8','$8-10','$10-14','$14-15','$15+'],
      datasets:[{data:[2089,123,112,6,54,93,31],backgroundColor:'rgba(74,222,128,.3)',borderColor:'#4ADE80',borderWidth:1,borderRadius:2}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{grid:G.grid,ticks:{...G.ticks,font:{size:9,family:'DM Mono'}}},y:{grid:G.grid,ticks:G.ticks}}}
  });
}

function p1(){
  document.getElementById('content').innerHTML=`
  <div class="kpis c4">
    <div class="kpi"><div class="kl">Amazon Logistics</div><div class="kv" style="color:var(--gr)">59.7%</div><div class="ks">~1,180 ships · $5.74 avg</div></div>

      plugins:{legend:{display:true,position:'bottom',labels:{color:'#6B7D74',font:{size:9,family:'DM Mono'},boxWidth:7,padding:6}}}}
  });

  chart=donut('cs',[6773,3474,2917,1208,223,541]);
}
